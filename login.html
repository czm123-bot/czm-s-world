<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="common-glass.css">
    <style>
        *{
            tap-highlight-color:transparent;
            -webkit-tap-highlight-color:transparent;
        }
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:0;
            overflow-x:hidden;
            -webkit-backface-visibility:hidden;
            backface-visibility:hidden;
            transform:translate3d(0,0,0);
            background: linear-gradient(145deg, #dbe1e8 0%, #c9d2dd 100%);
            transition: background 0.6s ease;
        }
        body.transition-active {
            background: rgba(20, 25, 35, 0.85);
        }
        .glass-transition{
            position:fixed;
            inset:0;
            z-index:9999;
            pointer-events:none;
            -webkit-backface-visibility:hidden;
            backface-visibility:hidden;
            transform:translate3d(0,0,0);
            perspective: 800px;
        }
        .glass-transition .glass-circle{
            position:absolute;
            left:50%;
            top:50%;
            width:200px;
            height:200px;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            -webkit-backdrop-filter:var(--glass-blur);
            backdrop-filter:var(--glass-blur);
            border:var(--glass-border);
            box-shadow:0 0 60px rgba(255,255,255,0.40), inset 0 0 40px rgba(255,255,255,0.10);
            transform:scale(0) translate(-50%,-50%) translate3d(0,0,0) rotate(0deg);
            opacity:0;
            will-change:transform, opacity;
        }
        .glass-transition .glass-circle::before{
            content:"";
            position:absolute;
            inset:-16px;
            border-radius:50%;
            background:radial-gradient(circle at 35% 25%,rgba(255,255,255,0.25),transparent 30%);
            filter:blur(10px);
        }
        .glass-transition .glass-circle::after{
            content:"";
            position:absolute;
            width:240%;
            height:240%;
            left:-70%;
            top:-70%;
            border-radius:50%;
            background:conic-gradient(from 0deg,transparent,rgba(255,255,255,0.20),transparent,rgba(255,255,255,0.10),transparent);
            animation:glass-sweep 1.8s linear infinite;
        }
        .glass-transition.active .glass-circle{
            animation:glass-expand 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .glass-transition .glass-wipe{
            position:absolute;
            left:50%;
            top:50%;
            width:200vw;
            height:200vw;
            border-radius:50%;
            background:radial-gradient(circle, rgba(255,255,255,0.25), rgba(255,255,255,0.08) 20%, transparent 38%);
            transform:translate(-50%,-50%) scale(0) translate3d(0,0,0);
            opacity:0;
            will-change:transform, opacity;
        }
        .glass-transition.active .glass-wipe{
            animation:glass-wipe-expand 1.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .glass-transition .glass-ripple{
            position:absolute;
            left:50%;
            top:50%;
            width:300px;
            height:300px;
            border-radius:50%;
            background:radial-gradient(circle, rgba(255,255,255,0.15), transparent 50%);
            transform:translate(-50%,-50%) scale(0) rotate(0deg);
            opacity:0;
            will-change:transform, opacity;
            filter: blur(6px);
            mix-blend-mode: overlay;
        }
        .glass-transition.active .glass-ripple{
            animation:ripple-expand 2.0s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes glass-expand{
            0% { transform: scale(0) translate(-50%,-50%) translate3d(0,0,0) rotate(0deg); opacity:0; }
            10% { transform: scale(1.2) translate(-50%,-50%) translate3d(0,0,0) rotate(10deg); opacity:1; }
            30% { transform: scale(2) translate(-50%,-50%) translate3d(0,0,0) rotate(-5deg); opacity:1; }
            60% { transform: scale(8) translate(-50%,-50%) translate3d(0,0,0) rotate(15deg); opacity:0.9; }
            100% { transform: scale(18) translate(-50%,-50%) translate3d(0,0,0) rotate(20deg); opacity:0; }
        }
        @keyframes glass-wipe-expand{
            0% { transform: translate(-50%,-50%) scale(0) translate3d(0,0,0); opacity:0; }
            15% { transform: translate(-50%,-50%) scale(1.2) translate3d(0,0,0); opacity:0.8; }
            40% { transform: translate(-50%,-50%) scale(2.5) translate3d(0,0,0); opacity:0.5; }
            100% { transform: translate(-50%,-50%) scale(1.8) translate3d(0,0,0); opacity:0; }
        }
        @keyframes ripple-expand{
            0% { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity:0; }
            20% { transform: translate(-50%,-50%) scale(1.5) rotate(30deg); opacity:0.6; }
            60% { transform: translate(-50%,-50%) scale(4) rotate(-20deg); opacity:0.3; }
            100% { transform: translate(-50%,-50%) scale(8) rotate(45deg); opacity:0; }
        }
        @keyframes glass-sweep{
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-card{
            width:min(90%,420px);
            padding:40px 32px;
            background:var(--glass-bg-soft);
            -webkit-backdrop-filter:var(--glass-blur);
            backdrop-filter:var(--glass-blur);
            border:var(--glass-border);
            border-radius:28px;
            box-shadow:var(--glass-shadow);
            text-align:center;
            position:relative;
            z-index:1;
        }
        .login-card::before{
            content:"";
            position:absolute;
            inset:-1px;
            border-radius:28px;
            background:linear-gradient(135deg,rgba(255,255,255,0.75),rgba(255,255,255,0.35));
            z-index:-1;
            opacity:0.5;
        }
        .login-card h2{
            margin-bottom:12px;
            font-size:clamp(1.6rem,5vw,2.2rem);
            font-weight:600;
            color:#0f172a;
            letter-spacing:0.5px;
        }
        .login-card p{
            margin-bottom:28px;
            font-size:0.95rem;
            color:#64748b;
            line-height:1.6;
        }
        #enterBtn{
            position:relative;
            overflow:hidden;
            width:100%;
            padding:12px 10px;
            border-radius:40px;
            border:1px solid rgba(255,255,255,0.85);
            background:rgba(230, 242, 255, 0.80);
            -webkit-backdrop-filter:var(--glass-blur);
            backdrop-filter:var(--glass-blur);
            color:#0f172a;
            font-size:16px;
            font-weight:500;
            cursor:pointer;
            transition:all 0.32s cubic-bezier(0.4,0,0.2,1);
            box-shadow:
                    0 6px 20px rgba(15, 23, 42, 0.06),
                    inset 0 1px 0 rgba(255,255,255,0.98),
                    inset 0 -1px 0 rgba(0,0,0,0.04);
            -webkit-backface-visibility:hidden;
            backface-visibility:hidden;
        }
        #enterBtn .light-spot{
            position:absolute;
            width:200px;
            height:200px;
            border-radius:50%;
            background:radial-gradient(circle, rgba(255,255,255,0.45) 0%, transparent 60%);
            transform:translate(-50%,-50%);
            opacity:0;
            transition:opacity 0.18s ease;
            pointer-events:none;
            filter:blur(14px);
        }
        #enterBtn:hover .light-spot{
            opacity:1;
        }
        #enterBtn:hover{
            background:rgba(216, 235, 255, 0.90);
            transform:translateY(-3px) scale(1.02);
            box-shadow:
                    0 12px 32px rgba(15, 23, 42, 0.10),
                    inset 0 1px 0 rgba(255,255,255,0.98),
                    inset 0 -1px 0 rgba(0,0,0,0.06);
        }
        #enterBtn:active{
            transform:translateY(-1px) scale(1.01);
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2>欢迎进入站点</h2>
    <p>继续前往 TDCT 主页</p>
    <button id="enterBtn">
        <span class="light-spot"></span>
        进入主页
    </button>
</div>
<div class="glass-transition" id="glassTransition">
    <div class="glass-circle"></div>
    <div class="glass-wipe"></div>
    <div class="glass-ripple"></div>
</div>
<script>
    const TARGET_PAGE="index.html";
    const transition=document.getElementById("glassTransition");
    const enterBtn=document.getElementById("enterBtn");
    const lightSpot=enterBtn.querySelector(".light-spot");

    enterBtn.addEventListener("mouseenter",()=>{
        lightSpot.style.opacity=0;
    });
    enterBtn.addEventListener("mousemove",(e)=>{
        const rect=enterBtn.getBoundingClientRect();
        const x=e.clientX - rect.left;
        const y=e.clientY - rect.top;
        lightSpot.style.left=x+"px";
        lightSpot.style.top=y+"px";
        lightSpot.style.opacity=1;
    });
    enterBtn.addEventListener("mouseleave",()=>{
        lightSpot.style.opacity=0;
    });

    enterBtn.addEventListener("click",function(e){
        e.preventDefault();
        e.stopPropagation();
        document.body.classList.add('transition-active');
        transition.classList.add("active");
        const handler = function(e) {
            if (e.animationName === "glass-expand") {
                window.location.href = TARGET_PAGE;
                transition.removeEventListener("animationend", handler);
            }
        };
        transition.addEventListener("animationend", handler);
    });
</script>
</body>
</html>
