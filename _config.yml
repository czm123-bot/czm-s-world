
plugins:
cache:
  enabled: true          
  path: .jekyll-cache    
  grace_period: 3600    
headers:
  - source: "/*.html" 
    headers:
      - key: "Cache-Control"
        value: "public, max-age=86400"  
  - source: "/*.{png,jpg,webp,mp4,mp3}" 
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable" 
  - source: "/*.{css,js}"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=604800" 
