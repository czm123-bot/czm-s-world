<div class="music-player">
  <div class="player-cover">
    <img src="cover.jpg" alt="暂无封面">
  </div>
  <div class="player-info">
    <h3 class="music-title">当前播放：歌曲名称</h3>
    <p class="music-singer">歌手名称</p>
  </div>
  <div class="player-progress">
    <progress id="progress" value="0" max="100"></progress>
    <div class="time-display">
      <span id="current-time">00:00</span>
      <span>/</span>
      <span id="total-time">00:00</span>
    </div>
  </div>
  <div class="player-controls">
    <button id="prev-btn">← 上一首</button>
    <button id="play-btn">播放</button>
    <button id="next-btn">下一首 →</button>
  </div>
  <div class="music-list">
    <div class="list-item active" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129121118_001.mp3" data-title="歌曲1" data-singer="歌手A">1. 阿刁 - 张韶涵</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129121257_001.mp3" data-title="歌曲2" data-singer="歌手B">2. 光年之外 - 邓紫棋</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122044_001.mp3" data-title="歌曲3" data-singer="歌手C">3. 青花瓷 - 周杰伦</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122054_001.mp3" data-title="歌曲4" data-singer="歌手D">4. 晴天 - 周杰伦</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122116_001.mp3" data-title="歌曲5" data-singer="歌手E">5. 反方向的钟 - 周杰伦</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122105_001.mp3" data-title="歌曲5" data-singer="歌手E">5. 稻香 - 周杰伦</div>
  </div>
  <audio id="audio-player" preload="metadata">
    <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129121118_001.mp3" type="audio/mpeg">
  </audio>
</div>

<style>
  .music-player {
    max-width: 500px;
    margin: 30px auto;
    padding: 25px;
    background: #2c3e50;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    color: white;
    text-align: center;
  }
  .player-cover img {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 20px;
    border: 4px solid #3498db;
  }
  .music-title {
    font-size: 1.5rem;
    margin: 0 0 8px;
  }
  .music-singer {
    font-size: 1rem;
    color: #bdc3c7;
    margin: 0 0 20px;
  }
  .player-progress {
    margin: 0 0 20px;
  }
  #progress {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: #34495e;
    accent-color: #3498db;
    border: none;
  }
  .time-display {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: #bdc3c7;
    margin-top: 5px;
  }
  .player-controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 0 0 25px;
  }
  .player-controls button {
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    background: #3498db;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .player-controls button:hover {
    background: #2980b9;
    transform: translateY(-2px);
  }
  #play-btn {
    background: #e74c3c;
  }
  #play-btn:hover {
    background: #c0392b;
  }
  .music-list {
    background: #34495e;
    border-radius: 10px;
    padding: 10px 0;
    max-height: 200px;
    overflow-y: auto;
  }
  .list-item {
    padding: 10px 20px;
    text-align: left;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .list-item:hover {
    background: #2c3e50;
  }
  .list-item.active {
    background: #3498db;
    color: white;
  }
</style>

<script>
  const audio = document.getElementById('audio-player');
  const playBtn = document.getElementById('play-btn');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const progress = document.getElementById('progress');
  const currentTimeEl = document.getElementById('current-time');
  const totalTimeEl = document.getElementById('total-time');
  const musicTitle = document.querySelector('.music-title');
  const musicSinger = document.querySelector('.music-singer');
  const listItems = document.querySelectorAll('.list-item');
  let currentIndex = 0;

  listItems.forEach((item, index) => {
    item.addEventListener('click', () => {
      currentIndex = index;
      loadMusic();
      playMusic();
    });
  });

  playBtn.addEventListener('click', () => {
    audio.paused ? playMusic() : pauseMusic();
  });

  prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + listItems.length) % listItems.length;
    loadMusic();
    playMusic();
  });

  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % listItems.length;
    loadMusic();
    playMusic();
  });

  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('loadedmetadata', () => {
    totalTimeEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => {
    nextBtn.click();
  });

  progress.addEventListener('input', () => {
    const seekTime = (progress.value / 100) * audio.duration;
    audio.currentTime = seekTime;
  });

  function loadMusic() {
    const activeItem = document.querySelector('.list-item.active');
    if (activeItem) activeItem.classList.remove('active');
    listItems[currentIndex].classList.add('active');
    const src = listItems[currentIndex].dataset.src;
    const title = listItems[currentIndex].dataset.title;
    const singer = listItems[currentIndex].dataset.singer;
    audio.src = src;
    musicTitle.textContent = `当前播放：${title}`;
    musicSinger.textContent = singer;
  }

  function playMusic() {
    audio.play();
    playBtn.textContent = '暂停';
  }

  function pauseMusic() {
    audio.pause();
    playBtn.textContent = '播放';
  }

  function updateProgress() {
    if (isNaN(audio.duration)) return;
    const percent = (audio.currentTime / audio.duration) * 100;
    progress.value = percent;
    currentTimeEl.textContent = formatTime(audio.currentTime);
  }

  function formatTime(time) {
    if (isNaN(time)) return '00:00';
    const minutes = Math.floor(time / 60);
    const seconds = Math.floor(time % 60);
    return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }

  loadMusic();
</script>
