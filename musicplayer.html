<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" href="cover.jpeg" as="image" type="image/jpeg">
  <meta name="referrer" content="no-referrer-when-downgrade">

  <title>在线音乐播放器</title>
  <style>
    .music-player {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px 15px;
      background: #2c3e50;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      color: white;
      text-align: center;
      box-sizing: border-box;
    }
    .player-cover {
      width: 100%;
      max-width: 200px;
      margin: 0 auto 20px;
    }
    .player-cover img {
      width: 100%;
      height: auto;
      aspect-ratio: 1/1;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #3498db;
    }
    .music-title {
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      margin: 0 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 10px;
    }
    .music-singer {
      font-size: clamp(0.9rem, 3vw, 1rem);
      color: #bdc3c7;
      margin: 0 0 20px;
    }
    .player-progress {
      margin: 0 0 20px;
      padding: 0 10px;
    }
    #progress {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #34495e;
      accent-color: #3498db;
      border: none;
    }
    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #bdc3c7;
      margin-top: 5px;
    }
    .player-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 0 0 25px;
      padding: 0 10px;
    }
    .player-controls button {
      padding: 10px 20px;
      flex: 1;
      max-width: 120px;
      border: none;
      border-radius: 30px;
      background: #3498db;
      color: white;
      font-size: clamp(0.9rem, 3vw, 1rem);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .player-controls button:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }
    #play-btn {
      background: #e74c3c;
    }
    #play-btn:hover {
      background: #c0392b;
    }
    .music-list {
      background: #34495e;
      border-radius: 10px;
      padding: 10px 0;
      max-height: 400px;
      overflow-y: auto;
    }
    .list-item {
      padding: 10px 20px;
      text-align: left;
      cursor: pointer;
      transition: background 0.3s ease;
      font-size: clamp(0.9rem, 3vw, 1rem);
    }
    .list-item:hover {
      background: #2c3e50;
    }
    .list-item.active {
      background: #3498db;
      color: white;
    }
    @media (max-width: 480px) {
      .player-controls {
        gap: 5px;
      }
      .player-controls button {
        padding: 8px 12px;
        font-size: 0.8rem;
      }
      .music-player {
        padding: 15px 10px;
        margin: 15px auto;
      }
    }
  </style>
</head>
<body>
<div class="music-player">
  <div class="player-cover">
    <img src="cover.jpeg" alt="歌曲封面">
    </div>
  </div>
  <div class="player-info">
    <h3 class="music-title">当前播放：歌曲名称</h3>
    <p class="music-singer">歌手名称</p>
  </div>
  <div class="player-progress">
    <progress id="progress" value="0" max="100"></progress>
    <div class="time-display">
      <span id="current-time">00:00</span>
      <span>/</span>
      <span id="total-time">00:00</span>
    </div>
  </div>
  <div class="player-controls">
    <button id="prev-btn">← 上一首</button>
    <button id="play-btn">播放</button>
    <button id="next-btn">下一首 →</button>
  </div>
  <div class="music-list">
    <div class="list-item active" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129121118_001.mp3" data-title="阿刁" data-singer="张韶涵">1. 阿刁 - 张韶涵</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129121257_001.mp3" data-title="光年之外" data-singer="邓紫棋">2. 光年之外 - 邓紫棋</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122044_001.mp3" data-title="青花瓷" data-singer="周杰伦">3. 青花瓷 - 周杰伦</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122054_001.mp3" data-title="晴天" data-singer="周杰伦">4. 晴天 - 周杰伦</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122116_001.mp3" data-title="反方向的钟" data-singer="周杰伦">5. 反方向的钟 - 周杰伦</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122105_001.mp3" data-title="稻香" data-singer="周杰伦">6. 稻香 - 周杰伦</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/泡沫.mp3" data-title="泡沫"  data-singer="邓紫棋">7.泡沫 - 邓紫棋</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/一路逆风.mp3" data-title="一路逆风"  data-singer="邓紫棋">8.一路逆风 - 邓紫棋</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/单行的轨道.mp3" data-title="单行的轨道"  data-singer="邓紫棋">9.单行的轨道 - 邓紫棋</div>
    <div class="list-item" data-src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/龙卷风.mp3" data-title="龙卷风"  data-singer="邓紫棋">10.龙卷风 - 邓紫棋</div>
  </div>

<audio id="audio-player" preload="metadata">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129121118_001.mp3" type="audio/mpeg">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129121257_001.mp3" type="audio/mpeg">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122044_001.mp3" type="audio/mpeg">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122054_001.mp3" type="audio/mpeg">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122116_001.mp3" type="audio/mpeg">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/DM_20251129122105_001.mp3" type="audio/mpeg">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/泡沫.mp3" type="audio/mpeg">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/一路逆风.mp3" type="audio/mpeg">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/单行的轨道.mp3" type="audio/mpeg">
  <source src="https://cdn.jsdmirror.com/gh/czm123-bot/czm-s-world/龙卷风.mp3" type="audio/mpeg">
</audio>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const totalTimeEl = document.getElementById('total-time');
    const musicTitle = document.querySelector('.music-title');
    const musicSinger = document.querySelector('.music-singer');
    const listItems = document.querySelectorAll('.list-item');
    let currentIndex = 0;

    listItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        currentIndex = index;
        loadMusic();
        playMusic();
      });
    });

    playBtn.addEventListener('click', () => {
      audio.paused ? playMusic() : pauseMusic();
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + listItems.length) % listItems.length;
      loadMusic();
      playMusic();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % listItems.length;
      loadMusic();
      playMusic();
    });

    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => {
      totalTimeEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      nextBtn.click();
    });

    progress.addEventListener('input', () => {
      audio.currentTime = (progress.value / 100) * audio.duration;
    });

    function loadMusic() {
      const activeItem = document.querySelector('.list-item.active');
      if (activeItem) activeItem.classList.remove('active');
      listItems[currentIndex].classList.add('active');
      const src = listItems[currentIndex].dataset.src;
      const title = listItems[currentIndex].dataset.title;
      const singer = listItems[currentIndex].dataset.singer;
      audio.src = src;
      musicTitle.textContent = `当前播放：${title}`;
      musicSinger.textContent = singer;
    }

    function playMusic() {
      audio.play().catch(e => {
        console.log('播放失败:', e);
      });
      playBtn.textContent = '暂停';
    }

    function pauseMusic() {
      audio.pause();
      playBtn.textContent = '播放';
    }

    function updateProgress() {
      if (isNaN(audio.duration)) return;
      progress.value = (audio.currentTime / audio.duration) * 100;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    }

    function formatTime(time) {
      if (isNaN(time)) return '00:00';
      const minutes = Math.floor(time / 60);
      const seconds = Math.floor(time % 60);
      return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    loadMusic();
  });
</script>

</body>
</html>
